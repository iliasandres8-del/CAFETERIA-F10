<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://ptkxxyqwbuotqhkiiszx.supabase.co wss://ptkxxyqwbuotqhkiiszx.supabase.co; base-uri 'self'; form-action 'self'" />
<title>Club F-10 — Caja e inventario</title>
<link rel="icon" type="image/png" href="img/escudo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Identidad real del Club Deportivo F-10 (tomada del escudo, img/escudo.png):
     rojo, negro y blanco — sin azul. --chart-hue es una única gráfica de barras y
     usa un azul aparte solo para diferenciar "cafetería" de "canchas" (verde) en el
     Resumen; no es un color de marca, ya está validado con dataviz/validate_palette.js. */
  :root {
    --bg: #F4F4F4; --surface: #FFFFFF; --ink: #171717; --muted: #5C5C5C; --faint: #979797;
    --line: #E4E4E4; --accent: #171717; --accent-soft: #ECECEC;
    --brand-red: #C41F1F; --brand-red-soft: #FBE6E6;
    --entrada: #2F7A54; --entrada-soft: #E5F3EB; --salida: #B5502F; --salida-soft: #F7E8E1;
    --amber: #B4791A; --amber-soft: #FBF0DD; --chart-hue: #2E5C99; --radius: 10px;
  }
  :root[data-theme="dark"] {
    --bg: #121212; --surface: #1C1C1C; --ink: #F2F2F2; --muted: #A3A3A3; --faint: #6E6E6E;
    --line: #2E2E2E; --accent: #B23A42; --accent-soft: #2E1719;
    --brand-red: #FF5C5C; --brand-red-soft: #3A1620;
    --entrada: #4CAF7A; --entrada-soft: #15301F; --salida: #D97A54; --salida-soft: #3A2015;
    --amber: #E0A83D; --amber-soft: #332508; --chart-hue: #5C93D8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212; --surface: #1C1C1C; --ink: #F2F2F2; --muted: #A3A3A3; --faint: #6E6E6E;
      --line: #2E2E2E; --accent: #B23A42; --accent-soft: #2E1719;
      --brand-red: #FF5C5C; --brand-red-soft: #3A1620;
      --entrada: #4CAF7A; --entrada-soft: #15301F; --salida: #D97A54; --salida-soft: #3A2015;
      --amber: #E0A83D; --amber-soft: #332508; --chart-hue: #5C93D8;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--bg); color: var(--ink); font-family:'Inter',sans-serif; }
  body { transition: background-color .15s ease, color .15s ease; }
  .ci-mono { font-family:'IBM Plex Mono',monospace; }
  .ci-display { font-family:'Space Grotesk',sans-serif; }

  #ci-root { display:none; width:100%; min-height:100vh; }
  #ci-root.show { display:flex; }

  .ci-sidebar { width:208px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--line); padding:20px 12px; display:flex; flex-direction:column; gap:4px; }
  .ci-brand { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; padding:4px 10px 18px; letter-spacing:-0.01em; }
  .ci-brand span { color: var(--accent); }
  .ci-nav-btn { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; border:none; background:transparent; color:var(--muted); font-size:13.5px; font-family:'Inter',sans-serif; cursor:pointer; text-align:left; width:100%; transition:background .12s ease,color .12s ease; }
  .ci-nav-btn:hover { background: var(--bg); color: var(--ink); }
  .ci-nav-btn.active { background: var(--accent-soft); color: var(--accent); font-weight:600; }

  .ci-main { flex:1; padding:28px 36px 60px; max-width:1040px; }
  .ci-header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:22px; }
  .ci-title { font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; }
  .ci-date { font-size:12.5px; color:var(--faint); font-family:'IBM Plex Mono',monospace; }

  .ci-toast { position:fixed; top:18px; right:18px; z-index:50; background:var(--ink); color:#fff; font-size:13px; padding:10px 16px; border-radius:8px; opacity:0; transition:opacity .2s ease; pointer-events:none; }
  .ci-toast.show { opacity:1; }

  .ci-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:28px; }
  .ci-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; }
  .ci-card-label { font-size:12.5px; color:var(--muted); margin-bottom:10px; }
  .ci-card-value { font-family:'IBM Plex Mono',monospace; font-size:32px; font-weight:600; }

  .ci-section { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:20px; overflow:hidden; }
  .ci-section-head { padding:14px 18px; border-bottom:1px solid var(--line); font-size:13px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  .ci-section-body { padding:18px; }

  .ci-form-row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .ci-field { display:flex; flex-direction:column; gap:4px; }
  .ci-field label { font-size:11.5px; color:var(--muted); }
  .ci-field input, .ci-field select, .ci-field textarea { font-family:'Inter',sans-serif; font-size:13px; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--ink); outline:none; min-width:150px; }
  .ci-field input:focus, .ci-field select:focus, .ci-field textarea:focus { border-color:var(--accent); background:var(--surface); }

  .ci-btn { display:inline-flex; align-items:center; gap:6px; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; padding:8px 14px; border-radius:7px; border:none; cursor:pointer; background:var(--accent); color:#fff; }
  .ci-btn:hover { opacity:.92; }
  .ci-btn.secondary { background:var(--bg); color:var(--ink); border:1px solid var(--line); }
  .ci-btn.tiny { padding:5px 9px; font-size:12px; }
  .ci-btn.recibido-btn { background: var(--entrada); }
  .ci-btn.peligro { background: var(--salida); }
  .ci-btn.peligro.secondary { background: var(--salida-soft); color: var(--salida); border: 1px solid var(--salida); }

  table.ci-table { width:100%; border-collapse:collapse; font-size:13px; }
  table.ci-table th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--faint); font-weight:600; padding:0 10px 8px; border-bottom:1px solid var(--line); }
  table.ci-table td { padding:10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.ci-table tr:last-child td { border-bottom:none; }
  table.ci-table input[type=number] { width:72px; padding:6px 8px; font-size:12.5px; border:1px solid var(--line); border-radius:6px; background:var(--bg); font-family:'IBM Plex Mono',monospace; outline:none; }
  table.ci-table input[type=number]:focus { border-color:var(--accent); background:var(--surface); }

  .ci-badge { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:20px; }
  .ci-badge.pendiente { background:var(--amber-soft); color:var(--amber); }
  .ci-badge.recibido { background:var(--entrada-soft); color:var(--entrada); }
  .ci-badge.cancelado { background:var(--bg); color:var(--faint); }
  .ci-badge.activo { background:var(--entrada-soft); color:var(--entrada); }
  .ci-badge.inactivo { background:var(--bg); color:var(--faint); }

  .ci-empty { color:var(--faint); font-size:13px; padding:6px 0; }

  .ci-hint { font-size:12px; color:var(--faint); margin-top:8px; }

  .ci-inv-layout { display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; }
  .ci-inv-side { flex-shrink:0; }
  .ci-inv-body { flex:1; min-width:440px; }

  .ci-cal { width:272px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
  .ci-cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .ci-cal-head button { border:none; background:var(--bg); border-radius:6px; width:26px; height:26px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); font-size:14px; }
  .ci-cal-head button:hover { background:var(--line); color:var(--ink); }
  .ci-cal-title { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; text-transform:capitalize; }
  .ci-cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .ci-cal-weekday { font-size:10px; color:var(--faint); text-align:center; padding-bottom:4px; font-weight:600; }
  .ci-cal-day { position:relative; height:30px; display:flex; align-items:center; justify-content:center; font-size:12px; border-radius:7px; border:none; background:transparent; color:var(--ink); cursor:pointer; font-family:'IBM Plex Mono',monospace; }
  .ci-cal-day:hover { background:var(--bg); }
  .ci-cal-day.empty { visibility:hidden; cursor:default; }
  .ci-cal-day.today { border:1px solid var(--accent); }
  .ci-cal-day.selected { background:var(--accent); color:#fff; font-weight:600; }
  .ci-cal-day.has-data::after { content:''; position:absolute; bottom:3px; width:4px; height:4px; border-radius:50%; background:var(--entrada); }
  .ci-cal-day.selected.has-data::after { background:#fff; }
  .ci-cal-today-btn { font-size:11.5px; color:var(--accent); background:none; border:none; cursor:pointer; margin-top:10px; padding:0; font-family:'Inter',sans-serif; }
  .ci-cal-legend { font-size:11px; color:var(--faint); margin-top:10px; display:flex; align-items:center; gap:6px; }
  .ci-cal-legend span { width:6px; height:6px; border-radius:50%; background:var(--entrada); display:inline-block; }

  .ci-daytotal { display:flex; gap:24px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .ci-daytotal-item div:first-child { font-size:12px; color:var(--muted); }
  .ci-daytotal-item strong { display:block; font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:600; margin-top:2px; }

  .ci-dia-actions { display:flex; gap:10px; margin-top:16px; }

  .ci-cat-header { display:flex; align-items:center; gap:8px; padding:10px 2px; font-weight:600; font-size:13px; cursor:pointer; color:var(--ink); border-bottom:1px solid var(--line); margin-top:14px; user-select:none; }
  .ci-cat-header:first-child { margin-top:0; }
  .ci-cat-header:hover { color: var(--accent); }
  .ci-cat-arrow { width:12px; display:inline-block; text-align:center; color:var(--muted); font-size:10px; }
  .ci-cat-count { color:var(--faint); font-weight:400; font-size:12px; }

  /* ---- escudo del club (img/escudo.png; el degradado es el respaldo mientras carga o si falla) ---- */
  .ci-crest { width:30px; height:30px; border-radius:50%; background: conic-gradient(from 180deg, var(--brand-red) 0 50%, var(--ink) 50% 100%); display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden; box-shadow: inset 0 0 0 2px var(--surface); }
  .ci-crest img { width:100%; height:100%; object-fit:cover; object-position:50% 40%; }
  .ci-crest.lg { width:56px; height:56px; margin:0 auto 10px; }
  .ci-brand-row { display:flex; align-items:center; gap:9px; padding:4px 10px 18px; }
  .ci-brand-row .ci-brand { padding:0; }

  /* ---- stock bajo ---- */
  .ci-badge.stockbajo { background: var(--brand-red-soft); color: var(--brand-red); }

  /* ---- conexión ---- */
  .ci-offline-banner { display:none; position:fixed; top:0; left:0; right:0; z-index:110; background: var(--amber); color:#241a00; font-size:12.5px; font-weight:600; text-align:center; padding:7px; }
  .ci-offline-banner.show { display:block; }

  /* ---- gráfica de ventas (barras) ---- */
  .ci-spark { display:flex; align-items:flex-end; gap:8px; height:110px; padding-top:6px; }
  .ci-spark-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px; cursor:default; }
  .ci-spark-bar-wrap { flex:1; display:flex; align-items:flex-end; width:100%; justify-content:center; }
  .ci-spark-bar { width:60%; min-width:10px; background: var(--chart-hue); border-radius:4px 4px 2px 2px; transition: opacity .12s ease; position:relative; }
  .ci-spark-col:hover .ci-spark-bar { opacity:.8; }
  .ci-spark-col.hoy .ci-spark-bar { background: var(--brand-red); }
  .ci-spark-day { font-size:10.5px; color:var(--faint); text-transform:capitalize; }
  .ci-spark-tip { position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:6px; background:var(--ink); color:var(--surface); font-size:11px; padding:4px 7px; border-radius:5px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .1s ease; }
  .ci-spark-col:hover .ci-spark-tip { opacity:1; }

  /* ---- resumen: desglose cafetería/canchas ---- */
  .ci-breakdown { display:flex; gap:16px; margin-top:10px; font-size:12px; color:var(--muted); }
  .ci-breakdown span b { color:var(--ink); font-family:'IBM Plex Mono',monospace; }
  .ci-dot { width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; }

  /* login gate */
  #ci-gate { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:100; }
  .ci-gate-box { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:32px; width:320px; max-width:calc(100vw - 32px); text-align:center; }
  .ci-gate-link { background:none; border:none; color:var(--accent); font-size:12.5px; margin-top:12px; cursor:pointer; font-family:'Inter',sans-serif; }
  .ci-nav-out { margin-top:auto; }
  .ci-gate-box h1 { font-family:'Space Grotesk',sans-serif; font-size:18px; margin:0 0 6px; }
  .ci-gate-box p { font-size:12.5px; color:var(--muted); margin:0 0 18px; }
  .ci-gate-box input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:7px; background:var(--bg); font-size:14px; margin-bottom:10px; outline:none; text-align:center; }
  .ci-gate-box input:focus { border-color:var(--accent); }
  .ci-gate-box button { width:100%; }
  .ci-gate-error { color:var(--salida); font-size:12px; margin-top:8px; min-height:14px; }
  #ci-loading { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; }

  /* ---- celular: la caja se maneja de noche desde el mostrador, con el teléfono ---- */
  @media (max-width: 720px) {
    #ci-root.show { flex-direction:column; }
    .ci-sidebar { width:100%; flex-direction:row; align-items:center; position:fixed; bottom:0; left:0; right:0; z-index:40;
      padding:6px 4px; border-right:none; border-top:1px solid var(--line); overflow-x:auto; gap:2px; }
    .ci-brand-row { display:none; }
    .ci-nav-btn { flex-direction:column; gap:2px; font-size:10.5px; padding:7px 8px; flex-shrink:0; min-width:60px; text-align:center; }
    .ci-nav-out { margin-top:0; order:99; }
    .ci-main { padding:16px 14px 90px; max-width:100%; }
    .ci-inv-layout { flex-direction:column; }
    .ci-cal { width:100%; }
    .ci-inv-body { min-width:0; width:100%; }
    table.ci-table input[type=number] { width:56px; min-height:38px; font-size:14px; }
    .ci-btn { min-height:40px; }
    .ci-cards { grid-template-columns: 1fr 1fr; }
    .ci-card-value { font-size:24px; }
    .ci-header { flex-wrap:wrap; gap:4px; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==" crossorigin="anonymous"></script>

</head>

<div class="ci-offline-banner" id="ci-offline-banner">Sin conexión — lo que hagas ahora no se está guardando. Espera a que vuelva la señal.</div>

   políticas RLS de db/schema.sql (solo cuentas listadas en caf_acceso). */
const SUPABASE_URL = "https://ptkxxyqwbuotqhkiiszx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB0a3h4eXF3YnVvdHFoa2lpc3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MjI2OTUsImV4cCI6MjEwNDk5ODY5NX0.rste8ln6sFVzS2QhyYNB4j5_043KBPSW5Y3CsDbBSjQ";

/* ---------- utilidades ---------- */
const nowISO = () => new Date().toISOString();

function fmtFecha(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("es-ES", { day: "2-digit", month: "short" }) + " · " +
    d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
}
function isoLocal(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function addDaysISO(dateStr, delta) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + delta);
  return isoLocal(d);
}
function fmtFechaLarga(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("es-ES", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
}
function fmtMoney(n) { return "$" + Math.round(n || 0).toLocaleString("es-CO"); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

const UNIDADES = ["unidades", "kg", "g", "l", "ml", "cajas", "bolsas"];
const PRECIO_CANCHA_BAJA = 60000;  // lunes a jueves, 3pm-5pm
const PRECIO_CANCHA_ALTA = 80000;  // lunes a jueves, 6pm en adelante
const PRECIO_CANCHA_FINDE = 100000; // viernes a domingo, o festivo, cualquier hora

function esFinDeSemana(fecha) {
  const dia = new Date(fecha + "T00:00:00").getDay(); // 0=domingo,5=viernes,6=sábado
  return dia === 0 || dia === 5 || dia === 6;
}
function calcularCanchas(fecha, festivo, cantBaja, cantAlta) {
  const b = Number(cantBaja) || 0, a = Number(cantAlta) || 0;
  if (festivo || esFinDeSemana(fecha)) {
    return { totalCanchas: a, totalDinero: a * PRECIO_CANCHA_FINDE };
  }
  return { totalCanchas: b + a, totalDinero: b * PRECIO_CANCHA_BAJA + a * PRECIO_CANCHA_ALTA };
}

let toastTimer = null;
function notify(text) {
  const t = document.getElementById("ci-toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- agrupación por categoría (con plegado) ---------- */
function agruparPorCategoria(productos) {
  const grupos = {};
  productos.forEach(p => {
    const cat = (p.categoria && p.categoria.trim()) || "Sin categoría";
    if (!grupos[cat]) grupos[cat] = [];
    grupos[cat].push(p);
  });
  const nombres = Object.keys(grupos).sort((a, b) => {
    if (a === "Sin categoría") return 1;
    if (b === "Sin categoría") return -1;
    return a.localeCompare(b, "es");
  });
  return nombres.map(nombre => ({ nombre, productos: grupos[nombre] }));
}
function isCatExpanded(cat) { return state.catExpanded[cat] !== false; }
function catHeaderHTML(cat, count) {
  const abierto = isCatExpanded(cat);
  return `<div class="ci-cat-header btn-toggle-cat" data-cat="${esc(cat)}">
    <span class="ci-cat-arrow">${abierto ? "▾" : "▸"}</span> ${esc(cat)} <span class="ci-cat-count">(${count})</span>
  </div>`;
}

/* ---------- estado global ---------- */
const state = {
  productos: [],
  distribuidoras: [],
  pedidos: [],
  conteos: [],
  canchas: [],
  tab: "dashboard",
  cal: { year: new Date().getFullYear(), month: new Date().getMonth(), selected: isoLocal(new Date()) },
  invRows: {},
  catExpanded: {},
  canchaRows: {},
};

function getProducto(id) { return state.productos.find(p => p.id === id); }
function getDistribuidora(id) { return state.distribuidoras.find(d => d.id === id); }

/* ---------- Supabase: mapeo de columnas (snake_case) a los nombres que usa la app ---------- */
const MAPPERS = {
  caf_productos: r => ({ id: r.id, nombre: r.nombre, categoria: r.categoria, unidad: r.unidad, cantidadExistente: r.cantidad_existente, precio: r.precio, stockMinimo: r.stock_minimo, creado: r.creado }),
  caf_distribuidoras: r => ({ id: r.id, nombre: r.nombre, contacto: r.contacto, activo: r.activo, creado: r.creado }),
  caf_pedidos: r => ({ id: r.id, productoId: r.producto_id, distribuidoraId: r.distribuidora_id, cantidad: r.cantidad, estado: r.estado, historialEstados: r.historial || [], creado: r.creado }),
  caf_conteos: r => ({ id: r.id, fecha: r.fecha, productoId: r.producto_id, entrada: r.entrada, salida: r.salida, precio: r.precio, vendido: r.vendido, dinero: r.dinero, actualizado: r.actualizado }),
  caf_canchas: r => ({ id: r.id, fecha: r.fecha, cantBaja: r.cant_baja, cantAlta: r.cant_alta, festivo: r.festivo, actualizado: r.actualizado }),
};

function errNotify(mensaje, error) {
  console.error(error);
  notify(mensaje);
}

/* ---------- Supabase: escritura ---------- */
async function crearProducto({ nombre, categoria, unidad, cantidadExistente, precio, stockMinimo }) {
  if (!nombre.trim()) return;
  const { error } = await sb.from("caf_productos").insert({
    nombre: nombre.trim(), categoria: categoria.trim(), unidad: unidad || "unidades",
    cantidad_existente: parseFloat(cantidadExistente) || 0, precio: parseFloat(precio) || 0,
    stock_minimo: parseFloat(stockMinimo) || 0,
  });
  if (error) return errNotify("No se pudo agregar el producto.", error);
  notify("Producto agregado.");
}
async function borrarProducto(id) {
  const p = getProducto(id);
  if (!p) return;
  const ok = window.confirm(`¿Eliminar "${p.nombre}" permanentemente? Esta acción no se puede deshacer.`);
  if (!ok) return;
  const { error } = await sb.from("caf_productos").delete().eq("id", id);
  if (error) return errNotify("No se pudo eliminar el producto.", error);
  notify("Producto eliminado.");
}
async function editarCantidadProducto(id, nuevaCantidad) {
  const val = parseFloat(nuevaCantidad);
  const { error } = await sb.from("caf_productos").update({ cantidad_existente: isNaN(val) ? 0 : val }).eq("id", id);
  if (error) return errNotify("No se pudo actualizar la cantidad.", error);
  notify("Cantidad actualizada.");
}
async function editarStockMinimo(id, nuevoMinimo) {
  const val = parseFloat(nuevoMinimo);
  const { error } = await sb.from("caf_productos").update({ stock_minimo: isNaN(val) ? 0 : val }).eq("id", id);
  if (error) return errNotify("No se pudo actualizar el mínimo de stock.", error);
  notify("Mínimo de stock actualizado.");
}
async function crearDistribuidora({ nombre, contacto }) {
  if (!nombre.trim()) return;
  const { error } = await sb.from("caf_distribuidoras").insert({ nombre: nombre.trim(), contacto: contacto.trim(), activo: true });
  if (error) return errNotify("No se pudo agregar la distribuidora.", error);
  notify("Distribuidora agregada.");
}
async function toggleDistribuidora(id) {
  const d = getDistribuidora(id);
  if (!d) return;
  const { error } = await sb.from("caf_distribuidoras").update({ activo: !d.activo }).eq("id", id);
  if (error) errNotify("No se pudo actualizar la distribuidora.", error);
}
async function crearPedido({ productoId, distribuidoraId, cantidad }) {
  const cant = parseInt(cantidad, 10);
  if (!productoId || !distribuidoraId || !cant || cant <= 0) return;
  const { error } = await sb.from("caf_pedidos").insert({
    producto_id: productoId, distribuidora_id: distribuidoraId, cantidad: cant, estado: "pendiente",
    historial: [{ estado: "pendiente", fecha: nowISO() }],
  });
  if (error) return errNotify("No se pudo registrar el pedido.", error);
  notify("Pedido registrado.");
}
async function marcarPedido(id, estado) {
  const pedido = state.pedidos.find(x => x.id === id);
  if (!pedido || pedido.estado !== "pendiente") return;
  const { error } = await sb.from("caf_pedidos").update({
    estado, historial: [...pedido.historialEstados, { estado, fecha: nowISO() }],
  }).eq("id", id);
  if (error) return errNotify("No se pudo actualizar el pedido.", error);
  if (estado === "recibido") {
    // Sumar el pedido al stock automáticamente, para no depender de que alguien
    // se acuerde de contarlo a mano en el próximo inventario diario.
    const producto = getProducto(pedido.productoId);
    if (producto) {
      const nuevaCantidad = (Number(producto.cantidadExistente) || 0) + (Number(pedido.cantidad) || 0);
      const { error: e2 } = await sb.from("caf_productos").update({ cantidad_existente: nuevaCantidad }).eq("id", producto.id);
      if (e2) { errNotify("El pedido quedó recibido, pero no se pudo sumar al stock. Súmalo a mano.", e2); return; }
      notify(`Pedido recibido. Se sumaron ${pedido.cantidad} ${producto.unidad} al stock de ${producto.nombre}.`);
    } else {
      notify("Pedido recibido. El producto ya no existe en el catálogo, cuenta el stock a mano.");
    }
  } else {
    notify("Pedido cancelado.");
  }
}
async function guardarDia(fecha, filas) {
  const payload = filas.map(f => ({
    fecha, producto_id: f.productoId,
    entrada: Number(f.entrada) || 0, salida: Number(f.salida) || 0, precio: Number(f.precio) || 0,
    actualizado: nowISO(),
  }));
  if (payload.length) {
    const { error } = await sb.from("caf_conteos").upsert(payload, { onConflict: "fecha,producto_id" });
    if (error) return errNotify("No se pudo guardar el inventario.", error);
  }
  notify("Inventario del día guardado.");
}
async function guardarCanchasDia(fecha, cantBaja, cantAlta, festivo) {
  const { error } = await sb.from("caf_canchas").upsert({
    fecha, cant_baja: Number(cantBaja) || 0, cant_alta: Number(cantAlta) || 0, festivo: !!festivo, actualizado: nowISO(),
  }, { onConflict: "fecha" });
  if (error) errNotify("No se pudieron guardar las canchas.", error);
}
async function borrarDia(fecha) {
  const registros = state.conteos.filter(c => c.fecha === fecha);
  const canchaDoc = state.canchas.find(c => c.fecha === fecha);
  if (registros.length === 0 && !canchaDoc) return;
  const ok = window.confirm(`¿Eliminar todo el inventario guardado de ${fmtFechaLarga(fecha)}? Esta acción no se puede deshacer.`);
  if (!ok) return;
  const { error: e1 } = await sb.from("caf_conteos").delete().eq("fecha", fecha);
  const { error: e2 } = await sb.from("caf_canchas").delete().eq("fecha", fecha);
  if (e1 || e2) return errNotify("No se pudo eliminar el inventario del día.", e1 || e2);
  delete state.invRows[fecha];
  delete state.canchaRows[fecha];
  notify("Inventario del día eliminado.");
}

/* ---------- suscripciones en tiempo real ---------- */
let canales = [];
async function cargarTabla(tabla, propiedadEstado, orderCol, orderAsc) {
  const { data, error } = await sb.from(tabla).select("*").order(orderCol, { ascending: orderAsc });
  if (error) return errNotify("Error de conexión con la base de datos.", error);
  state[propiedadEstado] = data.map(MAPPERS[tabla]);
  render();
}
function suscribir(tabla, propiedadEstado, orderCol, orderAsc) {
  cargarTabla(tabla, propiedadEstado, orderCol, orderAsc);
  const canal = sb.channel("rt-" + tabla)
    .on("postgres_changes", { event: "*", schema: "public", table: tabla }, () => cargarTabla(tabla, propiedadEstado, orderCol, orderAsc))
    .subscribe();
  canales.push(canal);
}
function cerrarSuscripciones() {
  canales.forEach(c => sb.removeChannel(c));
  canales = [];
}

/* ---------- render principal ---------- */
function render() {
  document.querySelectorAll(".ci-nav-btn[data-tab]").forEach(b => b.classList.toggle("active", b.dataset.tab === state.tab));
  const main = document.getElementById("ci-main");
  if (state.tab === "dashboard") main.innerHTML = viewDashboard();
  else if (state.tab === "productos") main.innerHTML = viewProductos();
  else if (state.tab === "distribuidoras") main.innerHTML = viewDistribuidoras();
  else if (state.tab === "inventario") main.innerHTML = viewInventario();
  else if (state.tab === "pedidos") main.innerHTML = viewPedidos();
  attachHandlers();
}

function headerHTML(title) {
  const hoy = new Date().toLocaleDateString("es-ES", { weekday: "long", day: "2-digit", month: "long" });
  return `<div class="ci-header"><div class="ci-title">${title}</div><div class="ci-date">${hoy}</div></div>`;
}

/* ---------- vista: dashboard ---------- */
function viewDashboard() {
  const hoyISO = isoLocal(new Date());
  const mesPrefix = hoyISO.slice(0, 7);
  const ventaCafeHoy = state.conteos.filter(c => c.fecha === hoyISO).reduce((acc, c) => acc + c.dinero, 0);
  const ventaCafeMes = state.conteos.filter(c => c.fecha.slice(0, 7) === mesPrefix).reduce((acc, c) => acc + c.dinero, 0);
  const canchasDia = (fecha) => {
    const c = state.canchas.find(x => x.fecha === fecha);
    if (!c) return { dinero: 0, canchas: 0 };
    const r = calcularCanchas(fecha, c.festivo, c.cantBaja, c.cantAlta);
    return { dinero: r.totalDinero, canchas: r.totalCanchas };
  };
  const canchasHoy = canchasDia(hoyISO);
  const canchasMesArr = state.canchas.filter(c => c.fecha.slice(0, 7) === mesPrefix).map(c => canchasDia(c.fecha));
  const ventaCanchasMes = canchasMesArr.reduce((a, x) => a + x.dinero, 0);
  const totalCanchasMes = canchasMesArr.reduce((a, x) => a + x.canchas, 0);
  const ventaHoy = ventaCafeHoy + canchasHoy.dinero;
  const ventaMes = ventaCafeMes + ventaCanchasMes;

  // venta total (cafetería + canchas) de los últimos 7 días, para la gráfica
  const dias = []; for (let i = 6; i >= 0; i--) dias.push(addDaysISO(hoyISO, -i));
  const ventaDia = (fecha) => state.conteos.filter(c => c.fecha === fecha).reduce((a, c) => a + c.dinero, 0) + canchasDia(fecha).dinero;
  const serie = dias.map(f => ({ fecha: f, valor: ventaDia(f) }));
  const maxValor = Math.max(1, ...serie.map(s => s.valor));

  let html = headerHTML("Resumen");
  html += `<div class="ci-cards">
    <div class="ci-card"><div class="ci-card-label">Venta de hoy</div><div class="ci-card-value" style="color:var(--brand-red)">${fmtMoney(ventaHoy)}</div>
      <div class="ci-breakdown"><span><span class="ci-dot" style="background:var(--chart-hue)"></span>Cafetería <b>${fmtMoney(ventaCafeHoy)}</b></span><span><span class="ci-dot" style="background:var(--entrada)"></span>Canchas <b>${fmtMoney(canchasHoy.dinero)}</b></span></div></div>
    <div class="ci-card"><div class="ci-card-label">Venta de este mes</div><div class="ci-card-value" style="color:var(--brand-red)">${fmtMoney(ventaMes)}</div>
      <div class="ci-breakdown"><span><span class="ci-dot" style="background:var(--chart-hue)"></span>Cafetería <b>${fmtMoney(ventaCafeMes)}</b></span><span><span class="ci-dot" style="background:var(--entrada)"></span>Canchas <b>${fmtMoney(ventaCanchasMes)}</b></span></div></div>
    <div class="ci-card"><div class="ci-card-label">⚽ Canchas vendidas hoy</div><div class="ci-card-value">${canchasHoy.canchas}</div></div>
    <div class="ci-card"><div class="ci-card-label">⚽ Canchas vendidas este mes</div><div class="ci-card-value">${totalCanchasMes}</div></div>
  </div>`;

  html += `<div class="ci-section"><div class="ci-section-head">Venta total (cafetería + canchas) de los últimos 7 días</div><div class="ci-section-body">
    <div class="ci-spark">
      ${serie.map(s => {
        const h = Math.max(4, Math.round((s.valor / maxValor) * 84));
        const label = new Date(s.fecha + "T00:00:00").toLocaleDateString("es-ES", { weekday: "short" }).replace(".", "");
        return `<div class="ci-spark-col ${s.fecha === hoyISO ? "hoy" : ""}">
          <div class="ci-spark-bar-wrap"><div class="ci-spark-bar" style="height:${h}px"><span class="ci-spark-tip">${fmtMoney(s.valor)}</span></div></div>
          <div class="ci-spark-day">${label}</div>
        </div>`;
      }).join("")}
    </div>
  </div></div>`;

  html += `<div class="ci-hint" style="margin-bottom:20px">Incluye cafetería y canchas, sumando automáticamente todos los días que hayas guardado en el Inventario diario. Pasa el dedo o el mouse por una barra para ver el monto exacto de ese día.</div>`;
  return html;
}

/* ---------- vista: inventario diario ---------- */
function viewInventario() {
  const productos = state.productos;
  const cal = state.cal;
  const selectedDate = cal.selected;
  const anteriorISO = addDaysISO(selectedDate, -1);

  if (!state.invRows[selectedDate]) {
    state.invRows[selectedDate] = productos.map(p => {
      const existente = state.conteos.find(c => c.fecha === selectedDate && c.productoId === p.id);
      const anterior = state.conteos.find(c => c.fecha === anteriorISO && c.productoId === p.id);
      return {
        productoId: p.id,
        entrada: existente ? existente.entrada : (anterior ? anterior.salida : (p.cantidadExistente || 0)),
        salida: existente ? existente.salida : 0,
        precio: existente ? existente.precio : (p.precio || 0),
      };
    });
  }
  const filas = state.invRows[selectedDate];
  const yaGuardado = state.conteos.some(c => c.fecha === selectedDate);

  // ---- canchas del día ----
  const canchaDoc = state.canchas.find(c => c.fecha === selectedDate);
  if (!state.canchaRows[selectedDate]) {
    state.canchaRows[selectedDate] = {
      festivo: canchaDoc ? !!canchaDoc.festivo : false,
      cantBaja: canchaDoc ? (canchaDoc.cantBaja || 0) : 0,
      cantAlta: canchaDoc ? (canchaDoc.cantAlta || 0) : 0,
    };
  }
  const canchaRow = state.canchaRows[selectedDate];
  const yaGuardadoCanchas = !!canchaDoc;

  const hasData = (dateStr) => state.conteos.some(c => c.fecha === dateStr) || state.canchas.some(c => c.fecha === dateStr);
  const firstOfMonth = new Date(cal.year, cal.month, 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7;
  const daysInMonth = new Date(cal.year, cal.month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);
  const monthLabel = new Date(cal.year, cal.month, 1).toLocaleDateString("es-ES", { month: "long", year: "numeric" });
  const hoy = new Date();

  let calHTML = `<div class="ci-cal">
    <div class="ci-cal-head"><button id="cal-prev">‹</button><div class="ci-cal-title">${monthLabel}</div><button id="cal-next">›</button></div>
    <div class="ci-cal-grid">${["L", "M", "X", "J", "V", "S", "D"].map(w => `<div class="ci-cal-weekday">${w}</div>`).join("")}
    ${cells.map(d => {
      if (d === null) return `<button class="ci-cal-day empty" disabled></button>`;
      const dateStr = isoLocal(new Date(cal.year, cal.month, d));
      const cls = ["ci-cal-day"];
      if (dateStr === isoLocal(hoy)) cls.push("today");
      if (dateStr === selectedDate) cls.push("selected");
      if (hasData(dateStr)) cls.push("has-data");
      return `<button class="${cls.join(" ")}" data-date="${dateStr}">${d}</button>`;
    }).join("")}
    </div>
    <button class="ci-cal-today-btn" id="cal-today">Ir a hoy</button>
    <div class="ci-cal-legend"><span></span>día con inventario guardado</div>
  </div>`;

  let totalVendido = 0, totalDineroProductos = 0;
  filas.forEach(f => {
    const vendido = (Number(f.entrada) || 0) - (Number(f.salida) || 0);
    totalVendido += vendido;
    totalDineroProductos += vendido * (Number(f.precio) || 0);
  });

  const { totalCanchas, totalDinero: totalDineroCanchas } = calcularCanchas(selectedDate, canchaRow.festivo, canchaRow.cantBaja, canchaRow.cantAlta);
  const totalGeneral = totalDineroProductos + totalDineroCanchas;

  let bodyHTML = `<div class="ci-section"><div class="ci-section-head" style="text-transform:capitalize">${fmtFechaLarga(selectedDate)}</div><div class="ci-section-body">`;
  if (productos.length === 0) {
    bodyHTML += `<div class="ci-empty">Agrega productos para poder registrar el inventario del día.</div>`;
  } else {
    const gruposHTML = agruparPorCategoria(productos).map(grupo => {
      let seccion = catHeaderHTML(grupo.nombre, grupo.productos.length);
      if (isCatExpanded(grupo.nombre)) {
        seccion += `<table class="ci-table"><thead><tr><th>Producto</th><th>Entrada (ayer)</th><th>Salida (hoy)</th><th>Vendido</th><th>Precio</th><th>Dinero</th></tr></thead><tbody>
          ${grupo.productos.map(p => {
            const f = filas.find(x => x.productoId === p.id);
            const vendido = (Number(f.entrada) || 0) - (Number(f.salida) || 0);
            const dinero = vendido * (Number(f.precio) || 0);
            return `<tr>
              <td>${esc(p.nombre)}</td>
              <td><input type="number" class="inv-input" data-pid="${p.id}" data-campo="entrada" value="${f.entrada}" /> <span class="ci-hint" style="margin-top:0">${esc(p.unidad)}</span></td>
              <td><input type="number" class="inv-input" data-pid="${p.id}" data-campo="salida" value="${f.salida}" /></td>
              <td class="ci-mono" style="color:${vendido < 0 ? "var(--salida)" : "var(--ink)"}">${vendido} ${esc(p.unidad)}</td>
              <td><input type="number" step="0.01" class="inv-input" data-pid="${p.id}" data-campo="precio" value="${f.precio}" /></td>
              <td class="ci-mono">${fmtMoney(dinero)}</td>
            </tr>`;
          }).join("")}
        </tbody></table>`;
      }
      return seccion;
    }).join("");

    bodyHTML += gruposHTML + `
    <div class="ci-daytotal">
      <div class="ci-daytotal-item"><div>Total vendido</div><strong>${totalVendido}</strong></div>
      <div class="ci-daytotal-item"><div>Total cafetería</div><strong>${fmtMoney(totalDineroProductos)}</strong></div>
    </div>`;
  }
  bodyHTML += `</div></div>`;

  // ---- sección canchas ----
  const finde = esFinDeSemana(selectedDate);
  const modoFinde = finde || canchaRow.festivo;
  bodyHTML += `<div class="ci-section"><div class="ci-section-head">⚽ Canchas vendidas</div><div class="ci-section-body">
    ${!finde ? `<label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:14px;cursor:pointer">
      <input type="checkbox" id="chk-festivo" ${canchaRow.festivo ? "checked" : ""} /> Marcar este día como festivo (tarifa de fin de semana, $100.000)
    </label>` : `<div class="ci-hint" style="margin-top:0;margin-bottom:14px">Fin de semana: tarifa fija de $100.000 por cancha.</div>`}
    ${modoFinde ? `
      <div class="ci-field">
        <label>Canchas jugadas (a ${fmtMoney(PRECIO_CANCHA_FINDE)} cada una)</label>
        <input type="number" min="0" class="cancha-input" data-campo="cantAlta" value="${canchaRow.cantAlta || 0}" style="width:100px" />
      </div>
    ` : `
      <div class="ci-form-row">
        <div class="ci-field">
          <label>Canchas de 3pm a 5pm (a ${fmtMoney(PRECIO_CANCHA_BAJA)})</label>
          <input type="number" min="0" class="cancha-input" data-campo="cantBaja" value="${canchaRow.cantBaja || 0}" style="width:100px" />
        </div>
        <div class="ci-field">
          <label>Canchas de 6pm en adelante (a ${fmtMoney(PRECIO_CANCHA_ALTA)})</label>
          <input type="number" min="0" class="cancha-input" data-campo="cantAlta" value="${canchaRow.cantAlta || 0}" style="width:100px" />
        </div>
      </div>
    `}
    <div class="ci-daytotal">
      <div class="ci-daytotal-item"><div>Canchas vendidas</div><strong>${totalCanchas}</strong></div>
      <div class="ci-daytotal-item"><div>Total canchas</div><strong>${fmtMoney(totalDineroCanchas)}</strong></div>
    </div>
  </div></div>`;

  // ---- total general + acciones ----
  bodyHTML += `<div class="ci-section"><div class="ci-section-body">
    <div class="ci-daytotal" style="margin-top:0;padding-top:0;border-top:none">
      <div class="ci-daytotal-item"><div>Total general del día</div><strong>${fmtMoney(totalGeneral)}</strong></div>
    </div>
    <div class="ci-dia-actions">
      <button class="ci-btn" id="btn-guardar-dia">✓ ${(yaGuardado || yaGuardadoCanchas) ? "Actualizar" : "Guardar"} inventario del día</button>
      ${(yaGuardado || yaGuardadoCanchas) ? `<button class="ci-btn peligro secondary" id="btn-borrar-dia">🗑 Eliminar datos de este día</button>` : ""}
      <button class="ci-btn secondary" id="btn-pdf-dia">📄 Generar PDF de este día</button>
    </div>
    <div class="ci-hint">La entrada de cafetería se completa sola con lo que quedó registrado el día anterior. Haz clic en el nombre de una categoría para plegarla o desplegarla.</div>
  </div></div>`;

  return headerHTML("Inventario diario") + `<div class="ci-inv-layout"><div class="ci-inv-side">${calHTML}</div><div class="ci-inv-body">${bodyHTML}</div></div>`;
}

/* ---------- vista: pedidos ---------- */
function viewPedidos() {
  const productos = state.productos;
  const distribuidorasActivas = state.distribuidoras.filter(d => d.activo);
  let html = headerHTML("Pedidos");
  html += `<div class="ci-section"><div class="ci-section-head">Registrar pedido</div><div class="ci-section-body">
    <form id="form-pedido" class="ci-form-row">
      <div class="ci-field"><label>Producto</label><select name="productoId" required>
        <option value="">Selecciona…</option>
        ${agruparPorCategoria(productos).map(grupo => `<optgroup label="${esc(grupo.nombre)}">
          ${grupo.productos.map(p => `<option value="${p.id}">${esc(p.nombre)}</option>`).join("")}
        </optgroup>`).join("")}
      </select></div>
      <div class="ci-field"><label>Distribuidora</label><select name="distribuidoraId" required>
        <option value="">Selecciona…</option>${distribuidorasActivas.map(d => `<option value="${d.id}">${esc(d.nombre)}</option>`).join("")}
      </select></div>
      <div class="ci-field"><label>Cantidad</label><input type="number" min="1" name="cantidad" style="min-width:90px" required /></div>
      <button class="ci-btn" type="submit">+ Registrar pedido</button>
    </form>
    ${(productos.length === 0 || distribuidorasActivas.length === 0) ? `<div class="ci-hint">Necesitas al menos un producto y una distribuidora activa para registrar un pedido.</div>` : ""}
  </div></div>`;

  html += `<div class="ci-section"><div class="ci-section-head">Pedidos (${state.pedidos.length})</div><div class="ci-section-body">`;
  if (state.pedidos.length === 0) {
    html += `<div class="ci-empty">Aún no hay pedidos registrados.</div>`;
  } else {
    html += `<table class="ci-table"><thead><tr><th>Fecha</th><th>Producto</th><th>Distribuidora</th><th>Cantidad</th><th>Estado</th><th></th></tr></thead><tbody>
    ${state.pedidos.map(p => {
      const prod = getProducto(p.productoId);
      const dist = getDistribuidora(p.distribuidoraId);
      const estadoLabel = p.estado === "pendiente" ? "Pendiente" : p.estado === "recibido" ? "Recibido" : "Cancelado";
      let accion;
      if (p.estado === "pendiente") {
        accion = `<div style="display:flex;gap:6px">
          <button class="ci-btn recibido-btn tiny btn-pedido" data-id="${p.id}" data-estado="recibido">✓ Recibido</button>
          <button class="ci-btn secondary tiny btn-pedido" data-id="${p.id}" data-estado="cancelado">✕ Cancelar</button>
        </div>`;
      } else {
        const ultimo = p.historialEstados[p.historialEstados.length - 1];
        accion = `<span style="font-size:11.5px;color:var(--faint)" class="ci-mono">${fmtFecha(ultimo.fecha)}</span>`;
      }
      return `<tr><td class="ci-mono">${fmtFecha(p.creado)}</td><td>${prod ? esc(prod.nombre) : "—"}</td><td>${dist ? esc(dist.nombre) : "—"}</td>
      <td class="ci-mono">${p.cantidad} ${prod ? esc(prod.unidad) : ""}</td>
      <td><span class="ci-badge ${p.estado}">${estadoLabel}</span></td><td>${accion}</td></tr>`;
    }).join("")}
    </tbody></table>`;
  }
  html += `<div class="ci-hint">El pedido nunca se elimina; su historial de estados queda guardado. Al marcarlo como recibido, la cantidad se suma sola al stock del producto en Productos.</div></div></div>`;
  return html;
}

/* ---------- listeners tras cada render ---------- */
function attachHandlers() {
  // ojo: esto se re-ejecuta en cada render(); [data-tab] evita reengachar los
  // botones fijos del sidebar (tema, cerrar sesión), que tienen su propio onclick fijado una sola vez.
  document.querySelectorAll(".ci-nav-btn[data-tab]").forEach(b => {
    b.onclick = () => { state.tab = b.dataset.tab; render(); };
  });

  document.querySelectorAll(".btn-toggle-cat").forEach(b => b.onclick = () => {
    const cat = b.dataset.cat;
    state.catExpanded[cat] = !isCatExpanded(cat);
    render();
  });

  const fp = document.getElementById("form-producto");
  if (fp) fp.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(fp);
    await crearProducto({ nombre: fd.get("nombre"), categoria: fd.get("categoria"), unidad: fd.get("unidad"), cantidadExistente: fd.get("cantidadExistente"), precio: fd.get("precio"), stockMinimo: fd.get("stockMinimo") });
    fp.reset();
  };
  document.querySelectorAll(".btn-borrar-producto").forEach(b => b.onclick = () => borrarProducto(b.dataset.id));
  document.querySelectorAll(".btn-guardar-cantidad").forEach(b => b.onclick = () => {
    const input = document.querySelector(`.cantidad-input[data-id="${b.dataset.id}"]`);
    editarCantidadProducto(b.dataset.id, input.value);
  });
  document.querySelectorAll(".btn-guardar-minimo").forEach(b => b.onclick = () => {
    const input = document.querySelector(`.minimo-input[data-id="${b.dataset.id}"]`);
    editarStockMinimo(b.dataset.id, input.value);
  });

  const fd2 = document.getElementById("form-distribuidora");
  if (fd2) fd2.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(fd2);
    await crearDistribuidora({ nombre: fd.get("nombre"), contacto: fd.get("contacto") });
    fd2.reset();
  };
  document.querySelectorAll(".btn-toggle-distribuidora").forEach(b => b.onclick = () => toggleDistribuidora(b.dataset.id));

  // inventario diario
  document.querySelectorAll(".ci-cal-day[data-date]").forEach(b => b.onclick = () => { state.cal.selected = b.dataset.date; render(); });
  const calPrev = document.getElementById("cal-prev");
  const calNext = document.getElementById("cal-next");
  const calToday = document.getElementById("cal-today");
  if (calPrev) calPrev.onclick = () => { cambiarMes(-1); };
  if (calNext) calNext.onclick = () => { cambiarMes(1); };
  if (calToday) calToday.onclick = () => {
    const hoy = new Date();
    state.cal.year = hoy.getFullYear(); state.cal.month = hoy.getMonth(); state.cal.selected = isoLocal(hoy);
    render();
  };
  document.querySelectorAll(".inv-input").forEach(inp => inp.onchange = () => {
    const filas = state.invRows[state.cal.selected];
    const fila = filas.find(x => x.productoId === inp.dataset.pid);
    if (fila) fila[inp.dataset.campo] = inp.value;
    render();
  });
  document.querySelectorAll(".cancha-input").forEach(inp => inp.onchange = () => {
    const row = state.canchaRows[state.cal.selected];
    if (row) row[inp.dataset.campo] = inp.value;
    render();
  });
  const chkFestivo = document.getElementById("chk-festivo");
  if (chkFestivo) chkFestivo.onchange = () => {
    const row = state.canchaRows[state.cal.selected];
    if (row) row.festivo = chkFestivo.checked;
    render();
  };
  const btnGuardarDia = document.getElementById("btn-guardar-dia");
  if (btnGuardarDia) btnGuardarDia.onclick = async () => {
    const fecha = state.cal.selected;
    await guardarDia(fecha, state.invRows[fecha]);
    await guardarCanchasDia(fecha, state.canchaRows[fecha].cantBaja, state.canchaRows[fecha].cantAlta, state.canchaRows[fecha].festivo);
  };
  const btnBorrarDia = document.getElementById("btn-borrar-dia");
  if (btnBorrarDia) btnBorrarDia.onclick = () => borrarDia(state.cal.selected);
  const btnPdfDia = document.getElementById("btn-pdf-dia");
  if (btnPdfDia) btnPdfDia.onclick = () => generarPDFDia(state.cal.selected);

  // pedidos
  const fpd = document.getElementById("form-pedido");
  if (fpd) fpd.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(fpd);
    await crearPedido({ productoId: fd.get("productoId"), distribuidoraId: fd.get("distribuidoraId"), cantidad: fd.get("cantidad") });
    fpd.reset();
  };
  document.querySelectorAll(".btn-pedido").forEach(b => b.onclick = () => marcarPedido(b.dataset.id, b.dataset.estado));
}

function generarPDFDia(fecha) {
  if (!window.jspdf) {
    notify("No se pudo cargar el generador de PDF. Revisa tu conexión a internet.");
    return;
  }
  const { jsPDF } = window.jspdf;
  const docPdf = new jsPDF();
  const filas = state.invRows[fecha] || [];
  const canchaRow = state.canchaRows[fecha] || { festivo: false, cantBaja: 0, cantAlta: 0 };

  docPdf.setFontSize(16);
  docPdf.text("Club F-10 - Resumen del día", 14, 16);
  docPdf.setFontSize(11);
  docPdf.text(fmtFechaLarga(fecha), 14, 24);

  const filasProductos = filas
    .map(f => {
      const p = getProducto(f.productoId);
      const vendido = (Number(f.entrada) || 0) - (Number(f.salida) || 0);
      const dinero = vendido * (Number(f.precio) || 0);
      return { nombre: p ? p.nombre : "—", vendido, unidad: p ? p.unidad : "", dinero };
    })
    .filter(r => r.vendido !== 0);

  let totalDineroProductos = 0;
  filasProductos.forEach(r => totalDineroProductos += r.dinero);

  docPdf.autoTable({
    startY: 30,
    head: [["Producto", "Vendido", "Dinero"]],
    body: filasProductos.length
      ? filasProductos.map(r => [r.nombre, `${r.vendido} ${r.unidad}`, fmtMoney(r.dinero)])
      : [["Sin ventas de cafetería registradas", "", ""]],
    styles: { fontSize: 9 },
    headStyles: { fillColor: [23, 23, 23] },
  });

  let y = docPdf.lastAutoTable.finalY + 6;
  docPdf.setFontSize(11);
  docPdf.text(`Total cafetería: ${fmtMoney(totalDineroProductos)}`, 14, y);

  const finde = esFinDeSemana(fecha) || canchaRow.festivo;
  const filasCanchas = [];
  if (finde) {
    if (canchaRow.cantAlta > 0) filasCanchas.push(["Canchas (tarifa fin de semana)", String(canchaRow.cantAlta), fmtMoney(canchaRow.cantAlta * PRECIO_CANCHA_FINDE)]);
  } else {
    if (canchaRow.cantBaja > 0) filasCanchas.push(["Canchas 3pm-5pm", String(canchaRow.cantBaja), fmtMoney(canchaRow.cantBaja * PRECIO_CANCHA_BAJA)]);
    if (canchaRow.cantAlta > 0) filasCanchas.push(["Canchas 6pm en adelante", String(canchaRow.cantAlta), fmtMoney(canchaRow.cantAlta * PRECIO_CANCHA_ALTA)]);
  }
  const totalDineroCanchas = calcularCanchas(fecha, canchaRow.festivo, canchaRow.cantBaja, canchaRow.cantAlta).totalDinero;

  docPdf.autoTable({
    startY: y + 6,
    head: [["Franja", "Canchas vendidas", "Subtotal"]],
    body: filasCanchas.length ? filasCanchas : [["Sin canchas vendidas registradas", "", ""]],
    styles: { fontSize: 9 },
    headStyles: { fillColor: [23, 23, 23] },
  });

  y = docPdf.lastAutoTable.finalY + 6;
  docPdf.setFontSize(11);
  docPdf.text(`Total canchas: ${fmtMoney(totalDineroCanchas)}`, 14, y);
  docPdf.setFontSize(13);
  docPdf.text(`Total general del día: ${fmtMoney(totalDineroProductos + totalDineroCanchas)}`, 14, y + 10);

  docPdf.save(`cafeteria-f10-${fecha}.pdf`);
}

function cambiarMes(delta) {
  let m = state.cal.month + delta, y = state.cal.year;
  if (m < 0) { m = 11; y -= 1; }
  if (m > 11) { m = 0; y += 1; }
  state.cal.month = m; state.cal.year = y;
  render();
}

/* ---------- arranque / autenticación (Supabase Auth + lista caf_acceso) ---------- */
let appIniciada = false;
function iniciarApp() {
  if (appIniciada) return;
  appIniciada = true;
  document.getElementById("ci-loading").style.display = "none";
  document.getElementById("ci-gate").style.display = "none";
  document.getElementById("ci-root").classList.add("show");
  render();
  suscribir("caf_productos", "productos", "creado", false);
  suscribir("caf_distribuidoras", "distribuidoras", "creado", false);
  suscribir("caf_pedidos", "pedidos", "creado", false);
  suscribir("caf_conteos", "conteos", "fecha", false);
  suscribir("caf_canchas", "canchas", "fecha", false);
}
function cerrarApp() {
  appIniciada = false;
  cerrarSuscripciones();
  document.getElementById("ci-root").classList.remove("show");
}

let gateMode = "signin";
function setGateMode(m) {
  gateMode = m;
  document.getElementById("ci-gate-sub").textContent = m === "signin" ? "Inicia sesión para entrar" : "Crea tu cuenta para entrar";
  document.getElementById("ci-gate-btn").textContent = m === "signin" ? "Entrar" : "Crear cuenta";
  document.getElementById("ci-gate-toggle").textContent = m === "signin" ? "¿No tienes cuenta? Crea una" : "¿Ya tienes cuenta? Inicia sesión";
  document.getElementById("ci-gate-input").autocomplete = m === "signin" ? "current-password" : "new-password";
  document.getElementById("ci-gate-error").textContent = "";
}
function mostrarGate() {
  document.getElementById("ci-loading").style.display = "none";
  document.getElementById("ci-gate").style.display = "flex";
  document.getElementById("ci-gate-main").style.display = "block";
  document.getElementById("ci-noaccess").style.display = "none";
}
function mostrarSinAcceso(email) {
  document.getElementById("ci-loading").style.display = "none";
  document.getElementById("ci-gate").style.display = "flex";
  document.getElementById("ci-gate-main").style.display = "none";
  document.getElementById("ci-noaccess").style.display = "block";
  document.getElementById("ci-noaccess-mail").textContent = email || "";
}

document.getElementById("ci-gate-toggle").onclick = () => setGateMode(gateMode === "signin" ? "signup" : "signin");
document.getElementById("ci-gate-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("ci-gate-email").value.trim();
  const password = document.getElementById("ci-gate-input").value;
  const err = document.getElementById("ci-gate-error");
  const btn = document.getElementById("ci-gate-btn");
  err.textContent = "";
  if (!email || !password) { err.textContent = "Completa tu correo y contraseña."; return; }
  btn.disabled = true;
  const { data, error } = gateMode === "signin"
    ? await sb.auth.signInWithPassword({ email, password })
    : await sb.auth.signUp({ email, password });
  btn.disabled = false;
  if (error) { err.textContent = error.message; return; }
  if (gateMode === "signup" && !data.session) {
    err.textContent = "Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.";
    setGateMode("signin");
  }
});
document.getElementById("ci-noaccess-out").onclick = () => sb.auth.signOut();
document.getElementById("ci-signout").onclick = () => sb.auth.signOut();

/* ---------- modo oscuro/claro ---------- */
function applyTheme(mode) {
  document.documentElement.setAttribute("data-theme", mode);
  const btn = document.getElementById("ci-theme-toggle");
  if (btn) btn.innerHTML = mode === "dark" ? `☀️<span> Modo claro</span>` : `🌙<span> Modo oscuro</span>`;
}
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem("ci_theme"); } catch (e) {}
  const mode = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(mode);
})();
document.getElementById("ci-theme-toggle").onclick = () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("ci_theme", next); } catch (e) {}
};

/* ---------- aviso de conexión: para que en la caja de noche no se pierda un guardado en silencio ---------- */
function actualizarBannerConexion() {
  document.getElementById("ci-offline-banner").classList.toggle("show", !navigator.onLine);
}
window.addEventListener("online", actualizarBannerConexion);
window.addEventListener("offline", actualizarBannerConexion);
actualizarBannerConexion();

async function tieneAcceso() {
  const { data, error } = await sb.from("caf_acceso").select("user_id").maybeSingle();
  if (error) { console.error(error); return false; }
  return !!data;
}

sb.auth.onAuthStateChange((_event, session) => {
  // Supabase puede bloquearse si dentro de este callback se hacen más llamadas
  // a Supabase de inmediato; por eso se difiere con setTimeout.
  setTimeout(async () => {
    if (!session) { cerrarApp(); mostrarGate(); return; }
    const ok = await tieneAcceso();
    if (ok) iniciarApp();
    else { cerrarApp(); mostrarSinAcceso(session.user.email); }
  }, 0);
});
</script>
